[project]
name = "murmur"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.0",
    "sounddevice>=0.4.7",
]

[project.optional-dependencies]
# CUDA runtime libs for NVIDIA GPUs. `./setup` installs these only when an
# NVIDIA GPU is detected (uv sync --extra gpu). CPU/AMD/ARM installs skip them.
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.23.2.1",
]
# Desktop GUI: tray icon, settings window, first-run installer.
gui = [
    "PySide6>=6.7",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
